# Drop in as /etc/nginx/sites-available/kite-bot.drim.works
# then: ln -s /etc/nginx/sites-available/kite-bot.drim.works /etc/nginx/sites-enabled/
#        nginx -t && systemctl restart nginx
#        certbot certonly --webroot -w /var/www/html -d kite-bot.drim.works
#        (then add the 443 ssl server block, or: certbot install --cert-name kite-bot.drim.works --nginx --redirect
#         and re-add the ACME location on :80 if certbot strips it)
#
# Do not set default_server — leave the existing ai-dictionary.drim.works vhost alone.
#
# IPv4-only listen: on KVM 1801176, `listen [::]:80` can fail bind during reload and
# leave workers on a stale config (vhost appears in nginx -T but never serves traffic).

server {
    listen 80;
    server_name kite-bot.drim.works;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
